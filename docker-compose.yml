services:
  elenia-collector:
    image: ghcr.io/saavuori/elenia-data-collector:latest
    container_name: elenia-collector
    restart: unless-stopped
    # Reached by container name through the shared web-proxy network, so no
    # host port is published. See caddy-proxy for the matching vhost route:
    # https://github.com/Saavuori/caddy-proxy
    #
    # To run standalone without a reverse proxy, uncomment the ports block.
    # Pick a free host port — 3000 and 8080 are commonly already taken.
    # ports:
    #   - "3001:3000"
    networks:
      - web-proxy
    volumes:
      - ./credentials.json:/app/credentials.json
      - ./influx_config.json:/app/influx_config.json
    labels:
      - "com.centurylinklabs.watchtower.scope=elenia-collector"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-elenia
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_SCOPE=elenia-collector
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LOG_LEVEL=info
      # Matches the docker API version. If you hit issues, you can remove this or set it dynamically.
      - DOCKER_API_VERSION=1.45
    labels:
      - "com.centurylinklabs.watchtower.scope=elenia-collector"

networks:
  web-proxy:
    external: true
